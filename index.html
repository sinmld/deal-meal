<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1e8">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Deal Meal</title>
<style>
:root{--bg:#f4f1e8;--card:#fffdf7;--text:#20231f;--muted:#73776f;--accent:#557a52;--accent2:#dfe9d8;--line:#e5e1d7}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:560px;margin:auto;padding:22px 18px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.logo{font-size:13px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent)}
h1{font-size:34px;line-height:1.05;margin:7px 0 10px;letter-spacing:-1px}.sub{color:var(--muted);margin:0 0 22px}
.hero{background:var(--accent);color:white;border-radius:26px;padding:24px;margin-bottom:18px;box-shadow:0 12px 28px #557a5225}
.hero small{opacity:.8}.hero h2{font-size:25px;margin:7px 0}.hero p{opacity:.9;margin:0 0 18px}
button{border:0;font:inherit;cursor:pointer}.primary{background:white;color:var(--accent);font-weight:800;padding:13px 18px;border-radius:14px}
.section-title{font-size:17px;font-weight:800;margin:24px 0 12px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--card);border:1px solid var(--line);padding:9px 13px;border-radius:999px;color:#4e534c}.chip.active{background:var(--accent2);border-color:#c9dac1;color:#355333;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.meal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;min-height:112px}.meal .emoji{font-size:26px}.meal b{display:block;margin-top:9px}.meal span{font-size:12px;color:var(--muted)}
.recipe{display:none;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:16px}.recipe.show{display:block}.tag{display:inline-block;background:var(--accent2);color:#355333;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:700;margin-right:5px}.recipe h2{margin:13px 0 5px;font-size:25px}.meta{color:var(--muted);font-size:13px}.recipe h3{font-size:14px;margin:18px 0 8px}.recipe ul,.recipe ol{padding-left:20px;line-height:1.65;margin:0}.save{float:right;background:none;font-size:25px}.empty{color:var(--muted);font-size:14px;padding:10px 0}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="logo">MOJA KUHINJA</div><div id="savedCount">♡ 0</div></div>
  <h1>Šta jedem<br>danas?</h1>
  <p class="sub">Brze i normalne ideje za zdrav obrok.</p>

  <section class="hero">
    <small>NASUMIČNA IDEJA</small>
    <h2 id="ideaName">Klikni i izaberi.</h2>
    <p id="ideaDesc">Bez komplikovanja, sa sastojcima koje lako nalaziš.</p>
    <button class="primary" onclick="randomRecipe()">Daj mi ideju →</button>
  </section>

  <div class="section-title">Filtriraj</div>
  <div class="chips" id="filters"></div>

  <div class="section-title">Obroci</div>
  <div class="grid">
    <button class="meal" onclick="pickType('Doručak')"><div class="emoji">🍳</div><b>Doručak</b><span>Počni kako treba</span></button>
    <button class="meal" onclick="pickType('Ručak')"><div class="emoji">🍲</div><b>Ručak</b><span>Glavni obrok</span></button>
    <button class="meal" onclick="pickType('Večera')"><div class="emoji">🥗</div><b>Večera</b><span>Lakše i jednostavno</span></button>
    <button class="meal" onclick="pickType('Užina')"><div class="emoji">🍎</div><b>Užina</b><span>Nešto između</span></button>
  </div>

  <section class="recipe" id="recipe"></section>
</div>
<script>
const recipes=[
{name:"Sočivo sa povrćem",type:"Ručak",time:25,tags:["Jeftino","High protein","Bez mesa"],desc:"Toplo, zasitno i odlično za spremanje unapred.",ing:["200 g sočiva","1 luk","1 šargarepa","1 paprika","200 g paradajza","maslinovo ulje","so, biber, paprika"],steps:["Operi sočivo i skuvaj ga dok ne omekša.","Na malo ulja prodinstaj luk, šargarepu i papriku.","Dodaj paradajz i začine, pa ubaci kuvano sočivo.","Kuvaj još 5-10 minuta."]},
{name:"Ovsena kaša sa bananom",type:"Doručak",time:7,tags:["Brzo","Jeftino"],desc:"Jednostavan doručak koji drži sitost.",ing:["60 g ovsenih pahuljica","1 banana","200 ml mleka ili biljnog napitka","cimet","kašika kikiriki putera"],steps:["Skuvaj ovsene sa mlekom.","Dodaj isečenu bananu i cimet.","Na vrh stavi kikiriki puter."]},
{name:"Jaja + avokado tost",type:"Doručak",time:10,tags:["Brzo","High protein"],desc:"Brzo, ukusno i bez komplikovanja.",ing:["2-3 jaja","1/2 avokada","2 kriške integralnog hleba","paradajz","so i biber"],steps:["Ispeci jaja po želji.","Izgnječi avokado i začini.","Složi tost sa avokadom, jajima i paradajzom."]},
{name:"Tunjevina salata",type:"Večera",time:8,tags:["Brzo","High protein","Low calorie"],desc:"Lagano, ali dovoljno konkretno za večeru.",ing:["1 konzerva tunjevine","zelena salata","paradajz","krastavac","kukuruz","limun","maslinovo ulje"],steps:["Ocedi tunjevinu.","Iseci povrće.","Sve pomešaj i začini limunom i maslinovim uljem."]},
{name:"Pečeni krompir + pasulj",type:"Ručak",time:35,tags:["Jeftino","Bez mesa"],desc:"Jeftin, zasitan obrok sa dosta vlakana.",ing:["300 g krompira","200 g kuvanog pasulja","luk","paprika","maslinovo ulje","začini"],steps:["Krompir iseci i začini.","Peci oko 30 minuta na 220°C.","Pomešaj sa pasuljem, lukom i paprikom."]},
{name:"Grčki jogurt + voće",type:"Užina",time:3,tags:["Brzo","High protein"],desc:"Najbrža opcija kada ti se ništa ne sprema.",ing:["200 g grčkog jogurta","šaka bobičastog voća","1 banana","malo oraha"],steps:["Sve stavi u činiju.","Dodaj voće i orašaste plodove."]},
{name:"Omlet sa povrćem",type:"Večera",time:12,tags:["Brzo","High protein","Low calorie"],desc:"Proteinski obrok gotov za desetak minuta.",ing:["3 jaja","paprika","paradajz","mladi luk","so i biber"],steps:["Umuti jaja.","Kratko proprži povrće.","Prelij jajima i ispeci omlet."]},
{name:"Hummus bowl",type:"Ručak",time:10,tags:["Brzo","Bez mesa"],desc:"Mediteranska činija bez mesa.",ing:["hummus","krastavac","paradajz","šargarepa","leblebije","zelena salata"],steps:["Iseci povrće.","Dodaj hummus i leblebije.","Začini limunom, maslinovim uljem i biberom."]}
];
let active="Sve", current=null;
const filters=["Sve","Brzo","Jeftino","High protein","Low calorie","Bez mesa"];
document.getElementById("filters").innerHTML=filters.map(x=>`<button class="chip ${x==="Sve"?"active":""}" onclick="setFilter('${x}')">${x}</button>`).join("");
function setFilter(f){active=f;document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("active",b.textContent===f));}
function available(type=null){return recipes.filter(r=>(active==="Sve"||r.tags.includes(active))&&(!type||r.type===type))}
function randomRecipe(type=null){let a=available(type);if(!a.length){document.getElementById("ideaName").textContent="Nema takvog predloga.";return}current=a[Math.floor(Math.random()*a.length)];document.getElementById("ideaName").textContent=current.name;document.getElementById("ideaDesc").textContent=current.desc;render(current)}
function pickType(t){randomRecipe(t);document.getElementById("recipe").scrollIntoView({behavior:"smooth",block:"start"})}
function render(r){const saved=JSON.parse(localStorage.getItem("saved")||"[]");const is=saved.includes(r.name);document.getElementById("recipe").innerHTML=`<button class="save" onclick="toggleSave('${r.name}')">${is?"♥":"♡"}</button><span class="tag">${r.type}</span>${r.tags.map(t=>`<span class="tag">${t}</span>`).join("")}<h2>${r.name}</h2><div class="meta">⏱ ${r.time} min</div><h3>SASTOJCI</h3><ul>${r.ing.map(x=>`<li>${x}</li>`).join("")}</ul><h3>PRIPREMA</h3><ol>${r.steps.map(x=>`<li>${x}</li>`).join("")}</ol>`;document.getElementById("recipe").classList.add("show")}
function toggleSave(name){let s=JSON.parse(localStorage.getItem("saved")||"[]");s=s.includes(name)?s.filter(x=>x!==name):[...s,name];localStorage.setItem("saved",JSON.stringify(s));document.getElementById("savedCount").textContent=`♡ ${s.length}`;if(current)render(current)}
document.getElementById("savedCount").textContent=`♡ ${JSON.parse(localStorage.getItem("saved")||"[]").length}`;
randomRecipe();
</script>
</body>
</html>
